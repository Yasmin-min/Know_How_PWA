<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f2edc" />
    <title>Sem conexão · KnowHow</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #17151f;
        color: #ffffff;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 360px; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 22px; margin: 20px 0 8px; }
      p { margin: 0 0 24px; color: #b9b5cf; line-height: 1.5; }
      button {
        height: 44px;
        padding: 0 24px;
        border: none;
        border-radius: 10px;
        background: #4f2edc;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Você está sem conexão</h1>
      <p>O KnowHow precisa de internet para carregar suas aulas e conversas. Verifique sua rede e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
